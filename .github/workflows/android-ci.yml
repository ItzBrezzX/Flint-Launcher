name: Android CI

on:
  push:
    branches: [main, 'fix/native-jvm-lifecycle-guard']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Compile, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android NDK and LWJGL build tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ant autoconf automake libtool

      # Uses the Gradle version pinned here until a wrapper jar is committed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Gradle wrapper (only when a wrapper jar is committed)
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        uses: gradle/actions/wrapper-validation@v4

      - name: Dependency resolution check
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath --quiet > /dev/null

      - name: Compile all modules (debug)
        run: gradle assembleDebug --stacktrace

      - name: Unit tests
        run: gradle test --stacktrace

      - name: Android Lint
        run: gradle lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    # Enable only after turning on Dependency graph and setting the repository variable.
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
