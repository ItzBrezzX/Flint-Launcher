# Reproducible multi-ABI APK with Flint GLFW and pinned LWJGL JNI modules.
# Fails if any required Android native module is missing.
name: Android Build (multi-ABI native)

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/build-recovery', 'fix/native-jvm-lifecycle-guard']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_NDK_VERSION: "27.0.12077973"
  ANDROID_BUILD_TOOLS: "35.0.0"
  # Quoted so YAML does not coerce 8.9 → 8.9 (float) incorrectly in some parsers.
  GRADLE_VERSION: "8.9"

jobs:
  build-arm64:
    name: Build debug APK + verify native .so
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install platform, build-tools, NDK, CMake (pinned)
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          sudo apt-get update
          sudo apt-get install -y ant autoconf automake libtool
          sdkmanager --list_installed | tee "${RUNNER_TEMP}/sdk-installed.txt"

      # Official behavior: when gradle-version is set, that distribution is
      # downloaded, cached, and added to PATH. The `gradle` executable is then
      # available even if gradle-wrapper.jar is not committed.
      # Docs: https://github.com/gradle/actions/blob/main/docs/setup-gradle.md
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        id: setup-gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle on PATH
        run: |
          set -euo pipefail
          command -v gradle
          gradle --version | tee "${RUNNER_TEMP}/gradle-version.txt"
          gradle --version | grep -q "Gradle 8.9"

      - name: Wrapper validation (only when wrapper jar is committed)
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile native module (arm64-v8a)
        run: |
          set -euo pipefail
          gradle :native:assembleDebug --stacktrace --info | tee "${RUNNER_TEMP}/native-build.log"

      - name: Verify native library for every packaged ABI
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/so-path.txt"
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            SO=$(find native/build -name 'libflint_native.so' -path "*/${ABI}/*" | head -n1 || true)
            GLFW=$(find native/build -name 'libglfw.so' -path "*/${ABI}/*" | head -n1 || true)
            LWJGL=$(find native/build -name 'liblwjgl.so' -path "*/${ABI}/*" | head -n1 || true)
            LWJGL_GLFW=$(find native/build -name 'liblwjgl_glfw.so' -path "*/${ABI}/*" | head -n1 || true)
            LWJGL_OPENGL=$(find native/build -name 'liblwjgl_opengl.so' -path "*/${ABI}/*" | head -n1 || true)
            if [ -z "${SO}" ] || [ -z "${GLFW}" ] || [ -z "${LWJGL}" ] || [ -z "${LWJGL_GLFW}" ] || [ -z "${LWJGL_OPENGL}" ]; then
              echo "::error::Missing Flint or LWJGL native module for ${ABI}"
              find native/build -type f -name '*.so' -print || true
              exit 1
            fi
            echo "Found ${ABI}: ${SO} ${GLFW} ${LWJGL} ${LWJGL_GLFW} ${LWJGL_OPENGL}"
            ls -la "${SO}" "${GLFW}" "${LWJGL}" "${LWJGL_GLFW}" "${LWJGL_OPENGL}"
            file "${SO}" "${GLFW}" "${LWJGL}" "${LWJGL_GLFW}" "${LWJGL_OPENGL}" || true
            NM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
            READELF="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
            if ! "${READELF}" -d "${GLFW}" | grep -F "libflint_native.so"; then
              echo "::error::libglfw.so for ${ABI} is not linked against the Flint EGL/event bridge"
              exit 1
            fi
            for DEP in liblwjgl.so libglfw.so; do
              if ! "${READELF}" -d "${LWJGL_GLFW}" | grep -F "${DEP}"; then
                echo "::error::liblwjgl_glfw.so for ${ABI} is missing dependency ${DEP}"
                exit 1
              fi
            done
            if ! "${READELF}" -d "${LWJGL_OPENGL}" | grep -F "liblwjgl.so"; then
              echo "::error::liblwjgl_opengl.so for ${ABI} is missing liblwjgl.so dependency"
              exit 1
            fi
            for SYMBOL IN glfwInit glfwTerminate glfwInitHint glfwInitAllocator glfwGetVersion glfwGetVersionString glfwGetError glfwSetErrorCallback glfwGetPlatform glfwPlatformSupported glfwGetMonitors glfwGetPrimaryMonitor glfwGetMonitorPos glfwGetMonitorWorkarea glfwGetMonitorPhysicalSize glfwGetMonitorContentScale glfwGetMonitorName glfwSetMonitorUserPointer glfwGetMonitorUserPointer glfwSetMonitorCallback glfwGetVideoModes glfwGetVideoMode glfwSetGamma glfwGetGammaRamp glfwSetGammaRamp glfwDefaultWindowHints glfwWindowHint glfwWindowHintString glfwCreateWindow glfwDestroyWindow glfwWindowShouldClose glfwSetWindowShouldClose glfwGetWindowTitle glfwSetWindowTitle glfwSetWindowIcon glfwGetWindowPos glfwSetWindowPos glfwGetWindowSize glfwSetWindowSizeLimits glfwSetWindowAspectRatio glfwSetWindowSize glfwGetFramebufferSize glfwGetWindowFrameSize glfwGetWindowContentScale glfwGetWindowOpacity glfwSetWindowOpacity glfwIconifyWindow glfwRestoreWindow glfwMaximizeWindow glfwShowWindow glfwHideWindow glfwFocusWindow glfwRequestWindowAttention glfwGetWindowMonitor glfwSetWindowMonitor glfwGetWindowAttrib glfwSetWindowAttrib glfwSetWindowUserPointer glfwGetWindowUserPointer glfwSetWindowPosCallback glfwSetWindowSizeCallback glfwSetWindowCloseCallback glfwSetWindowRefreshCallback glfwSetWindowFocusCallback glfwSetWindowIconifyCallback glfwSetWindowMaximizeCallback glfwSetFramebufferSizeCallback glfwSetWindowContentScaleCallback glfwPollEvents glfwWaitEvents glfwWaitEventsTimeout glfwPostEmptyEvent glfwGetInputMode glfwSetInputMode glfwRawMouseMotionSupported glfwGetKeyName glfwGetKeyScancode glfwGetKey glfwGetMouseButton glfwGetCursorPos glfwSetCursorPos glfwCreateCursor glfwCreateStandardCursor glfwDestroyCursor glfwSetCursor glfwSetKeyCallback glfwSetCharCallback glfwSetCharModsCallback glfwSetMouseButtonCallback glfwSetCursorPosCallback glfwSetCursorEnterCallback glfwSetScrollCallback glfwSetDropCallback glfwJoystickPresent glfwGetJoystickAxes glfwGetJoystickButtons glfwGetJoystickHats glfwGetJoystickName glfwGetJoystickGUID glfwSetJoystickUserPointer glfwGetJoystickUserPointer glfwJoystickIsGamepad glfwSetJoystickCallback glfwUpdateGamepadMappings glfwGetGamepadName glfwGetGamepadState glfwSetClipboardString glfwGetClipboardString glfwGetTime glfwSetTime glfwGetTimerValue glfwGetTimerFrequency glfwMakeContextCurrent glfwGetCurrentContext glfwSwapBuffers glfwSwapInterval glfwExtensionSupported glfwGetProcAddress; do
              if ! "${NM}" -D --defined-only "${GLFW}" | grep -E "[[:space:]]${SYMBOL}$"; then
                echo "::error::libglfw.so for ${ABI} does not export ${SYMBOL}"
                exit 1
              fi
            done
            for MODULE in "${LWJGL}" "${LWJGL_GLFW}" "${LWJGL_OPENGL}"; do
              if ! "${NM}" -D --defined-only "${MODULE}" | grep -E "Java_org_lwjgl_"; then
                echo "::error::LWJGL JNI exports missing from ${MODULE}"
                exit 1
              fi
            done
            echo "${ABI}: ${SO} ${GLFW} ${LWJGL} ${LWJGL_GLFW} ${LWJGL_OPENGL}" >> "${RUNNER_TEMP}/so-path.txt"
          done

      - name: Unit tests (host JVM)
        run: |
          set -euo pipefail
          gradle test --stacktrace | tee "${RUNNER_TEMP}/unit-tests.log"

      - name: Assemble debug APK
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace | tee "${RUNNER_TEMP}/app-build.log"

      - name: Verify Flint and LWJGL native modules are packaged in the generated APK
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -name '*.apk' -type f | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No debug APK under app/build/outputs/apk/debug"
            find app/build/outputs -type f | head -50 || true
            exit 1
          fi
          APK="${APKS[0]}"
          echo "Checking APK: ${APK}"
          unzip -l "${APK}" | tee "${RUNNER_TEMP}/apk-listing.txt"
          # Every ABI advertised by app/build.gradle.kts must be present in the final APK.
          TMP=$(mktemp -d)
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            for LIB in libflint_native.so libglfw.so liblwjgl.so liblwjgl_glfw.so liblwjgl_opengl.so; do
              ENTRY="lib/${ABI}/${LIB}"
              if ! unzip -l "${APK}" | grep -F "${ENTRY}"; then
                echo "::error::APK is missing ${ENTRY}"
                exit 1
              fi
              unzip -o -d "${TMP}" "${APK}" "${ENTRY}"
              test -s "${TMP}/${ENTRY}"
              echo "OK: ${ENTRY} is present and non-empty"
            done
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: flint-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flint-build-logs
          path: |
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/app-build.log
            ${{ runner.temp }}/unit-tests.log
            ${{ runner.temp }}/apk-listing.txt
            ${{ runner.temp }}/sdk-installed.txt
            ${{ runner.temp }}/gradle-version.txt
            ${{ runner.temp }}/so-path.txt
            **/build/reports/tests/**
          if-no-files-found: ignore
