# Reproducible multi-ABI debug APK with native library verification.
# Fails if libflint_native.so, libGL.so, or libglfw.so is missing from the APK.
name: Android Build (multi-ABI native)

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/build-recovery']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_NDK_VERSION: "27.0.12077973"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.9"
  # Cap workers and heap so NDK + CMake + GL4ES compile stay inside runner RAM.
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.daemon=false"

jobs:
  build:
    name: Build debug APK + verify native .so
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install platform, build-tools, NDK, CMake (pinned)
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${ANDROID_HOME}/cmake/3.22.1"
          # CMake package ships ninja on Linux runners.
          test -x "${ANDROID_HOME}/cmake/3.22.1/bin/ninja" || command -v ninja
          sdkmanager --list_installed | tee "${RUNNER_TEMP}/sdk-installed.txt"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Verify wrapper and Gradle
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          ./gradlew --version | tee "${RUNNER_TEMP}/gradle-version.txt"
          ./gradlew --version | grep -q "Gradle 8.9"

      - name: Wrapper validation
        uses: gradle/actions/wrapper-validation@v4

      # Sequential stages reduce peak memory versus one combined assemble.
      - name: Compile native module (all packaged ABIs)
        run: |
          set -euo pipefail
          ./gradlew :native:assembleDebug --stacktrace --no-daemon | tee "${RUNNER_TEMP}/native-build.log"

      - name: Verify native libraries for every packaged ABI
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/so-path.txt"
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            for LIB in libflint_native.so libGL.so libglfw.so; do
              SO=$(find native/build -name "${LIB}" -path "*/${ABI}/*" | head -n1 || true)
              if [ -z "${SO}" ]; then
                echo "::error::${LIB} not found under native/build for ${ABI}"
                find native/build -type f -name '*.so' -print || true
                exit 1
              fi
              echo "Found ${ABI}: ${SO}"
              ls -la "${SO}"
              file "${SO}" || true
              # Non-empty ELF
              test -s "${SO}"
              echo "${ABI} ${LIB}: ${SO}" >> "${RUNNER_TEMP}/so-path.txt"
            done
          done

      - name: Unit tests (host JVM)
        run: |
          set -euo pipefail
          ./gradlew test --stacktrace --no-daemon | tee "${RUNNER_TEMP}/unit-tests.log"

      - name: Assemble debug APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon | tee "${RUNNER_TEMP}/app-build.log"

      - name: Verify natives packaged in APK
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -name '*.apk' -type f | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No debug APK under app/build/outputs/apk/debug"
            find app/build/outputs -type f | head -50 || true
            exit 1
          fi
          APK="${APKS[0]}"
          echo "Checking APK: ${APK}"
          unzip -l "${APK}" | tee "${RUNNER_TEMP}/apk-listing.txt"
          TMP=$(mktemp -d)
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            for LIB in libflint_native.so libGL.so libglfw.so; do
              ENTRY="lib/${ABI}/${LIB}"
              if ! unzip -l "${APK}" | grep -F "${ENTRY}"; then
                echo "::error::APK is missing ${ENTRY}"
                exit 1
              fi
              unzip -o -d "${TMP}" "${APK}" "${ENTRY}"
              test -s "${TMP}/${ENTRY}"
              file "${TMP}/${ENTRY}" || true
              echo "OK: ${ENTRY} is present and non-empty"
            done
          done

      - name: Verify NativeBridge JNI exports in packaged ELF libraries
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -s "$APK"
          python3 native/tools/verify_jni_exports.py "$APK" --abis arm64-v8a armeabi-v7a x86 x86_64

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flint-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flint-build-logs
          path: |
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/app-build.log
            ${{ runner.temp }}/unit-tests.log
            ${{ runner.temp }}/apk-listing.txt
            ${{ runner.temp }}/sdk-installed.txt
            ${{ runner.temp }}/gradle-version.txt
            ${{ runner.temp }}/so-path.txt
            **/build/reports/tests/**
          if-no-files-found: ignore
