# Spike 0.4 — reproducible ARM64 debug APK with native library verification.
# Fails the job if libflint_native.so is missing from the APK.
name: Android Build (arm64 native)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_NDK_VERSION: "27.0.12077973"
  ANDROID_BUILD_TOOLS: "35.0.0"
  # Quoted so YAML does not coerce 8.9 → 8.9 (float) incorrectly in some parsers.
  GRADLE_VERSION: "8.9"

jobs:
  build-arm64:
    name: Build debug APK + verify native .so
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, build-tools, NDK, CMake (pinned)
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          sdkmanager --list_installed | tee "${RUNNER_TEMP}/sdk-installed.txt"

      # Official behavior: when gradle-version is set, that distribution is
      # downloaded, cached, and added to PATH. The `gradle` executable is then
      # available even if gradle-wrapper.jar is not committed.
      # Docs: https://github.com/gradle/actions/blob/main/docs/setup-gradle.md
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        id: setup-gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle on PATH
        run: |
          set -euo pipefail
          command -v gradle
          gradle --version | tee "${RUNNER_TEMP}/gradle-version.txt"
          gradle --version | grep -q "Gradle 8.9"

      - name: Wrapper validation (only when wrapper jar is committed)
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile native module (arm64-v8a)
        run: |
          set -euo pipefail
          gradle :native:assembleDebug --stacktrace --info | tee "${RUNNER_TEMP}/native-build.log"

      - name: Locate libflint_native.so after module build
        run: |
          set -euo pipefail
          SO=$(find native/build -name 'libflint_native.so' -path '*/arm64-v8a/*' | head -n1 || true)
          if [ -z "${SO}" ]; then
            echo "::error::libflint_native.so not found under native/build for arm64-v8a"
            find native/build -type f -name '*.so' -print || true
            exit 1
          fi
          echo "Found ${SO}"
          ls -la "${SO}"
          file "${SO}" || true
          echo "${SO}" > "${RUNNER_TEMP}/so-path.txt"

      - name: Unit tests (host JVM)
        run: |
          set -euo pipefail
          gradle test --stacktrace | tee "${RUNNER_TEMP}/unit-tests.log"

      - name: Assemble debug APK
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace | tee "${RUNNER_TEMP}/app-build.log"

      - name: Verify libflint_native.so is packaged in the generated APK
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -name '*.apk' -type f | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No debug APK under app/build/outputs/apk/debug"
            find app/build/outputs -type f | head -50 || true
            exit 1
          fi
          APK="${APKS[0]}"
          echo "Checking APK: ${APK}"
          unzip -l "${APK}" | tee "${RUNNER_TEMP}/apk-listing.txt"
          if ! unzip -l "${APK}" | grep -E 'lib/arm64-v8a/libflint_native\.so$'; then
            echo "::error::APK is missing lib/arm64-v8a/libflint_native.so"
            exit 1
          fi
          # Extract and size-check the .so from the APK itself
          TMP=$(mktemp -d)
          unzip -o -d "${TMP}" "${APK}" "lib/arm64-v8a/libflint_native.so"
          ls -la "${TMP}/lib/arm64-v8a/libflint_native.so"
          test -s "${TMP}/lib/arm64-v8a/libflint_native.so"
          echo "OK: libflint_native.so present and non-empty inside APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flint-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flint-build-logs
          path: |
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/app-build.log
            ${{ runner.temp }}/unit-tests.log
            ${{ runner.temp }}/apk-listing.txt
            ${{ runner.temp }}/sdk-installed.txt
            ${{ runner.temp }}/gradle-version.txt
            ${{ runner.temp }}/so-path.txt
            **/build/reports/tests/**
          if-no-files-found: ignore
