name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 'true' only when a signing keystore secret is configured.
      HAS_SIGNING: ${{ secrets.FLINT_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flint-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode signing keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          FLINT_KEYSTORE_BASE64: ${{ secrets.FLINT_KEYSTORE_BASE64 }}
        run: echo "$FLINT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flint-release.jks"

      - name: Build signed release APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          FLINT_KEYSTORE_PATH: ${{ runner.temp }}/flint-release.jks
          FLINT_KEYSTORE_PASSWORD: ${{ secrets.FLINT_KEYSTORE_PASSWORD }}
          FLINT_KEY_ALIAS: ${{ secrets.FLINT_KEY_ALIAS }}
          FLINT_KEY_PASSWORD: ${{ secrets.FLINT_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flint-launcher-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Note when release signing is skipped
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: echo "::notice::Release APK skipped. Add the FLINT_KEYSTORE_* secrets to build a signed release."

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/flint-release.jks"
