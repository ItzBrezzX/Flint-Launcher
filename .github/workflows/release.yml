name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.FLINT_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Require signing secrets
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: |
          echo "::error::Releases must be signed. Configure FLINT_KEYSTORE_BASE64, FLINT_KEYSTORE_PASSWORD, FLINT_KEY_ALIAS and FLINT_KEY_PASSWORD."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Derive version from tag
        id: ver
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          FLINT_KEYSTORE_BASE64: ${{ secrets.FLINT_KEYSTORE_BASE64 }}
        run: echo "$FLINT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flint-release.jks"

      - name: Build signed release APK
        env:
          FLINT_KEYSTORE_PATH: ${{ runner.temp }}/flint-release.jks
          FLINT_KEYSTORE_PASSWORD: ${{ secrets.FLINT_KEYSTORE_PASSWORD }}
          FLINT_KEY_ALIAS: ${{ secrets.FLINT_KEY_ALIAS }}
          FLINT_KEY_PASSWORD: ${{ secrets.FLINT_KEY_PASSWORD }}
        run: >
          gradle :app:assembleRelease --stacktrace
          -PflintVersionName=${{ steps.ver.outputs.name }}
          -PflintVersionCode=${{ steps.ver.outputs.code }}

      - name: Collect APK and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FlintLauncher-${{ steps.ver.outputs.name }}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/flint-release.jks"
