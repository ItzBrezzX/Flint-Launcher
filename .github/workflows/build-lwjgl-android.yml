name: Build LWJGL for Android

# Builds LWJGL 3 (BSD-3-Clause) with Android natives for every ABI Flint ships.
# Input: the PojavLauncherTeam/lwjgl3 fork (an LWJGL 3.3.3 tree with Android build scripts, archived
# read-only since June 2025, so the branch can no longer move). Its own build script is used as-is:
#   LWJGL_BUILD_ARCH=<arm64|arm32|x86|x64> ANDROID_NDK_HOME=... JAVA8_HOME=... bash ci_build_android.bash
# Output (per the fork's README): bin/RELEASE = Java jars, bin/out = native libraries.
#
# Flint does NOT use this fork's GLFW: libglfw.so comes from native/src/main/cpp/glfw (our own code).
# Not verified by the author: nothing here has been run. Read the first failing step's log.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  LWJGL_REPO: https://github.com/PojavLauncherTeam/lwjgl3.git
  LWJGL_BRANCH: wip/rebase_3.3.3

jobs:
  lwjgl:
    name: LWJGL (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, abi: arm64-v8a }
          - { arch: arm32, abi: armeabi-v7a }
          - { arch: x86, abi: x86 }
          - { arch: x64, abi: x86_64 }
    steps:
      - name: Java 8 (the fork's ant build needs it)
        id: java8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Check the Android NDK on the runner
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME" || { echo "::error::No Android NDK on this runner image"; exit 1; }
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep -c 'android21-clang$'

      - name: Fetch LWJGL (Android fork)
        run: |
          git clone --depth 1 --branch "$LWJGL_BRANCH" "$LWJGL_REPO" lwjgl3
          git -C lwjgl3 rev-parse HEAD | tee lwjgl3-commit.txt

      - name: Build
        working-directory: lwjgl3
        env:
          LWJGL_BUILD_ARCH: ${{ matrix.arch }}
          JAVA8_HOME: ${{ steps.java8.outputs.path }}
        run: |
          export JAVA8_HOME="${JAVA8_HOME:-$JAVA_HOME}"
          bash ci_build_android.bash

      - name: Collect
        run: |
          mkdir -p out/jars out/jniLibs/${{ matrix.abi }}
          find lwjgl3/bin/RELEASE -name '*.jar' -exec cp -v {} out/jars/ \;
          cp -v lwjgl3/bin/out/liblwjgl*.so out/jniLibs/${{ matrix.abi }}/
          # The fork's script downloads OpenAL Soft into this folder but does not copy it to bin/out.
          cp -v lwjgl3/bin/libs/native/linux/${{ matrix.arch }}/org/lwjgl/openal/libopenal.so out/jniLibs/${{ matrix.abi }}/
          cp lwjgl3-commit.txt out/BUILD_INFO.txt
          find out -type f | sort
          # Fail early if the pieces Minecraft needs are missing.
          for f in lwjgl lwjgl-glfw lwjgl-opengl lwjgl-openal lwjgl-stb; do
            ls out/jars | grep -q "^$f" || { echo "::error::missing jar $f"; exit 1; }
          done
          for f in liblwjgl.so liblwjgl_opengl.so liblwjgl_stb.so libopenal.so; do
            test -f out/jniLibs/${{ matrix.abi }}/$f || { echo "::error::missing native $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: lwjgl-android-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
